<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="description" content="飲んだコーヒーと味を、1年の文字盤に記録していくデモ。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ドリップノート">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ドリップノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;600;700&display=swap">
<style>
/* Layout: 左にスマホ実寸の試作、右に体験の流れとデータの形。DESIGN-apple.md のトークンに従う。
   主役は1年を1周にした「コーヒー暦」（文字盤）。色は焙煎のグラデーション（明度だけ）、選択はアクションブルー。 */
:root {
  --primary: #0066cc;
  --primary-focus: #0071e3;
  --primary-on-dark: #2997ff;
  --ink: #1d1d1f;
  --ink-80: #333333;
  --ink-48: #7a7a7a;
  --hairline: #e0e0e0;
  --divider: #f0f0f0;
  --canvas: #ffffff;
  --parchment: #f5f5f7;
  --pearl: #fafafc;
  --tile: #272729;
  --on-dark: #ffffff;
  --on-dark-muted: #cccccc;
  --chip: rgba(210,210,215,.64);
  --frost: rgba(245,245,247,.8);
  --link: var(--primary);
  --sel: var(--primary);
  --neutral: #a1a1a6;
  --glass: rgba(0,0,0,.035);
  --t0: #d9b68c; --t1: #b98a5c; --t2: #96643c; --t3: #6b4329; --t4: #3a251a;
  --danger: #d70015;
  --product-shadow: drop-shadow(3px 5px 15px rgba(0,0,0,.22));
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --tight: -0.374px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f5f5f7; --ink-80: #d2d2d7; --ink-48: #8e8e93;
    --hairline: #38383a; --divider: #2c2c2e;
    --canvas: #1c1c1e; --parchment: #000000; --pearl: #2c2c2e; --tile: #272729;
    --frost: rgba(22,22,23,.8); --link: var(--primary-on-dark); --sel: #0a84ff; --danger: #ff453a;
    --neutral: #6e6e73; --glass: rgba(255,255,255,.05); --t0: #e3c29b; --t1: #c79a6c; --t2: #a6754b; --t3: #83573a; --t4: #5a3d2c;
    --product-shadow: drop-shadow(3px 5px 15px rgba(0,0,0,.6));
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f5f5f7; --ink-80: #d2d2d7; --ink-48: #8e8e93;
  --hairline: #38383a; --divider: #2c2c2e;
  --canvas: #1c1c1e; --parchment: #000000; --pearl: #2c2c2e; --tile: #272729;
  --frost: rgba(22,22,23,.8); --link: var(--primary-on-dark); --sel: #0a84ff; --danger: #ff453a;
    --neutral: #6e6e73; --glass: rgba(255,255,255,.05); --t0: #e3c29b; --t1: #c79a6c; --t2: #a6754b; --t3: #83573a; --t4: #5a3d2c;
  --product-shadow: drop-shadow(3px 5px 15px rgba(0,0,0,.6));
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--parchment); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: var(--tight); padding-inline: 16px; padding-block: 40px 64px; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }

.stage { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 400px minmax(0,1fr); gap: 64px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0,1fr); gap: 48px; } }

/* ---------- phone ---------- */
.phone { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); width: 100%; max-width: 400px; margin: 0 auto; height: min(820px, calc(100dvh - 48px)); min-height: 620px; background: #0b0b0c; border-radius: 52px; padding: 10px; }
@media (max-width: 900px) { .phone { position: relative; top: 0; } }
@media (max-width: 440px) {
  .phone { padding: 0; border-radius: 0; background: transparent; height: min(780px, calc(100dvh - 24px)); margin-inline: -16px; width: calc(100% + 32px); max-width: none; }
  .screen { border-radius: 0 !important; }
}
.screen { position: relative; height: 100%; border-radius: 42px; overflow: hidden; background: var(--parchment); display: flex; flex-direction: column; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; z-index: 4; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 14px; font-weight: 600; letter-spacing: -0.224px; font-variant-numeric: tabular-nums; pointer-events: none; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: 96px; }
.view::-webkit-scrollbar { display: none; }
.view.sheet { padding-bottom: 40px; }
.view.withdock { padding-bottom: 110px; }
.view.plain { background: var(--canvas); }
.topbar.sticky { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); gap: 4px; }
.tb-cap { font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mform { padding: 4px 20px 0; display: grid; gap: 18px; }
.mform hr { border: 0; border-top: 1px solid var(--divider); margin: 4px 0; }
.rhead { display: flex; align-items: center; gap: 14px; position: relative; }
.pslot { position: relative; width: 64px; height: 64px; border-radius: 14px; background: var(--parchment); color: var(--ink-48); display: grid; place-items: center; overflow: hidden; cursor: pointer; flex: none; }
.pslot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.rmp { position: absolute; left: 48px; top: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--canvas); font-size: 13px; line-height: 1; cursor: pointer; }
.rmeta { flex: 1; min-width: 0; display: grid; gap: 2px; }
.beanin { border: 0; outline: none; background: transparent; font-size: 24px; font-weight: 600; letter-spacing: -0.28px; padding: 0; width: 100%; color: var(--ink); }
.beanin::placeholder { color: var(--hairline); }
.datein { border: 0; outline: none; background: transparent; font-size: 14px; color: var(--ink-48); padding: 0; letter-spacing: -0.224px; }
.mrecent { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -6px -20px 0; padding: 0 20px; }
.mrecent::-webkit-scrollbar { display: none; }
.mrecent .lab { flex: none; }
.mstars { display: flex; justify-content: center; gap: 4px; }
.mstars .star { width: 44px; height: 44px; }
.mstars .star svg { width: 30px; height: 30px; }
.tastebox { display: grid; gap: 12px; }
.tsub { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-48); letter-spacing: -0.12px; }
.mpicked { display: flex; flex-wrap: wrap; gap: 6px; }
.mpicked .pk { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; background: var(--ink); color: var(--canvas); padding: 5px 11px; font-size: 13px; letter-spacing: -0.08px; cursor: pointer; }
.mpicked .pk span { font-size: 10px; opacity: .7; }
.msugg { background: var(--parchment); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.msugg-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.msugg .use { white-space: nowrap; border: 0; background: var(--canvas); color: var(--link); border-radius: 9999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.mgroups { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.mgrp { display: flex; align-items: center; gap: 8px; min-height: 44px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas); padding: 8px 12px; font-size: 14px; letter-spacing: -0.224px; text-align: left; cursor: pointer; white-space: nowrap; min-width: 0; }
.mgrp span { overflow: hidden; text-overflow: ellipsis; }
.mgrp i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mgrp small { margin-left: auto; color: var(--link); font-size: 12px; font-variant-numeric: tabular-nums; }
.mgrp[aria-expanded="true"] { border: 2px solid var(--primary-focus); padding: 7px 11px; }
.mgrp-open { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; background: var(--parchment); border-radius: 12px; padding: 10px; }
.fg { display: flex; flex-wrap: wrap; gap: 6px; }
.mdesc { margin: -6px 0 0; min-height: 20px; font-size: 13px; letter-spacing: -0.08px; color: var(--ink-48); }
.mdesc b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.mmemo { border: 0; border-radius: 12px; background: var(--parchment); min-height: 0; padding: 12px 14px; font-size: 16px; }
.addrow { justify-self: start; border: 0; background: none; color: var(--link); font-size: 15px; padding: 6px 0; cursor: pointer; }
.mbrew { display: grid; gap: 12px; }
.mbrew-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink-48); }
.menu-btn.sm { width: 32px; height: 32px; color: var(--ink-48); }
.mbrew .methods { padding: 0; }
.mrows { display: grid; }
.mrows .row { padding-inline: 0; }
.val.strong { font-size: 17px; font-weight: 600; }
.mfoot { position: sticky; bottom: 0; padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--canvas) 35%); }
.tabbar { display: none !important; }
.topbar { height: 96px; padding: 44px 12px 0; display: flex; align-items: center; }
.menu-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer; border-radius: 50%; flex: none; }
.menu-btn:active { background: var(--parchment); }
.subnav .menu-btn { margin-left: -10px; }
.subnav .menu-btn + h1 { margin-right: auto; }
.selhead { display: flex; justify-content: space-between; align-items: center; margin: 8px 20px 10px; font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px; }
.drawer { position: absolute; inset: 0; z-index: 6; }
.drawer .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.drawer .panel { position: absolute; top: 0; bottom: 0; left: 0; width: 72%; background: var(--canvas); padding: 104px 12px 24px; display: grid; align-content: start; gap: 2px; animation: slidein .25s ease both; }
@keyframes slidein { from { transform: translateX(-100%); } to { transform: none; } }
.drawer .panel button { text-align: left; border: 0; background: none; font-size: 21px; font-weight: 600; letter-spacing: .231px; padding: 12px 14px; border-radius: 12px; cursor: pointer; color: var(--ink); }
.drawer .panel button[aria-current] { color: var(--link); }
.drawer .panel button:active { background: var(--parchment); }
.dock { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 3; pointer-events: none; }
.dock-row { display: flex; align-items: center; gap: 12px; }
.dock-row > * { pointer-events: auto; }
.dock-row > span { flex: 1; pointer-events: none; }
.fab { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; transition: transform .2s ease; margin-left: auto; }
.fab:active { transform: scale(.95); }
.dock-pend { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--frost); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border: 1px solid var(--hairline); border-radius: 9999px; min-height: 56px; padding: 8px 18px; cursor: pointer; }
.dock-pend .dotmark { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
.dock-pend .txt { flex: 1; min-width: 0; display: grid; }
.dock-pend b { font-size: 14px; font-weight: 600; letter-spacing: -0.224px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-pend .txt span { font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-pend .go { color: var(--link); font-size: 14px; white-space: nowrap; }
.btn.lgbtn { min-height: 52px; font-size: 17px; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }

.subnav { position: sticky; top: 0; z-index: 3; min-height: 96px; padding: 44px 16px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--frost); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hairline); }
.subnav h1 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.19; letter-spacing: .231px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subnav.center { display: grid; grid-template-columns: 1fr auto 1fr; padding-inline: 12px; }
.subnav.center h1 { font-size: 17px; text-align: center; max-width: 180px; }
.subnav .side { display: flex; gap: 8px; align-items: center; }
.subnav.center .side:last-child { justify-content: flex-end; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding: 6px 40px 18px; display: flex; justify-content: space-around; align-items: center; background: var(--frost); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--hairline); z-index: 3; }
.tab { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 10px; letter-spacing: -0.08px; color: var(--ink-48); padding: 4px 16px; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--link); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 9999px; padding: 11px 22px; font-size: 17px; line-height: 1; border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer; transition: transform .2s ease; white-space: nowrap; }
.btn:active { transform: scale(.95); }
.btn.ghost { background: transparent; color: var(--link); border-color: var(--link); }
.btn.small { min-height: 34px; padding: 7px 16px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--hairline); }
.btn.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; transition: transform .2s ease; flex: none; }
.icon-btn:active { transform: scale(.95); }
.textbtn { background: none; border: 0; padding: 8px 4px; color: var(--link); cursor: pointer; font-size: 17px; white-space: nowrap; }
.textbtn:disabled { color: var(--ink-48); cursor: default; }
.textbtn.strong { font-weight: 600; }
.textbtn.sm { font-size: 14px; letter-spacing: -0.224px; padding: 4px 0; }

/* ---------- map (home) ---------- */
.maptile { background: var(--canvas); padding: 20px 16px 24px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.maptile .lead { margin: 0; font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px; }
.wheel { width: 100%; max-width: 344px; aspect-ratio: 1; display: block; }
.wheel .seg { cursor: pointer; }
.wheel .seg:focus { outline: none; }
.wheel .seg:focus-visible path { stroke: var(--primary-focus); stroke-width: 2.5; }
.wheel text { font-family: var(--font); letter-spacing: 0; pointer-events: none; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; margin-top: 8px; }
.legend i { display: block; width: 72px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--ink) 8%, transparent), var(--ink)); }

.dialtile { background: var(--canvas); padding: 0 10px 16px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.yearnav { display: flex; align-items: center; gap: 22px; }
.yname { font-size: 17px; font-weight: 600; min-width: 56px; font-variant-numeric: tabular-nums; }
.yr { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--parchment); color: var(--link); font-size: 22px; line-height: 1; cursor: pointer; transition: transform .2s ease; }
.yr:active { transform: scale(.92); }
.yr:disabled { color: var(--hairline); cursor: default; transform: none; }
.dial { width: 100%; max-width: 340px; display: block; }
.dial text { font-family: var(--font); letter-spacing: 0; }
.dial .tick { cursor: pointer; transition: opacity .25s ease; }
.dial .tick.grow { animation: grow .9s cubic-bezier(.2,1.3,.4,1) both; transform-box: view-box; transform-origin: 0 0; }
@keyframes grow { 0% { transform: scale(.55); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1); } }
.dialstats { margin: 0; font-size: 14px; color: var(--ink-80); letter-spacing: -0.224px; }
.dlegend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
.dlegend .key { display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; padding: 5px 10px; font-size: 12px; letter-spacing: -0.12px; border: 1px solid transparent; background: var(--canvas); color: var(--ink); cursor: pointer; transition: transform .2s ease; white-space: nowrap; }
.dlegend button.key:active { transform: scale(.95); }
.dlegend .key[aria-pressed="true"] { border: 2px solid var(--primary-focus); padding: 4px 10px; }
.dlegend .key.static { cursor: default; border-color: transparent; }
.dlegend .key i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.dlegend .key i.hollow { border: 1.5px dashed var(--ink-48); }
.dlegend .key small { color: var(--ink-48); font-size: 12px; font-variant-numeric: tabular-nums; }
.scale-note { margin: 6px 0 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; }
.scale-note .grad { width: 64px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--t0), var(--t1), var(--t2), var(--t3), var(--t4)); }
.pending { margin: 16px 20px 0; display: grid; gap: 8px; }
.pend { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; padding: 12px 14px 12px 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; width: 100%; }
.pend .dotmark { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
.pend .txt { flex: 1; min-width: 0; display: grid; }
.pend b { font-size: 15px; font-weight: 600; letter-spacing: -0.224px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pend span { font-size: 13px; color: var(--ink-48); letter-spacing: -0.08px; }
.pend .go { color: var(--link); font-size: 15px; white-space: nowrap; }

.section-title { margin: 0; padding: 32px 20px 12px; font-size: 24px; font-weight: 600; line-height: 1.17; letter-spacing: -0.28px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-wrap: balance; }
.section-title small { font-size: 14px; font-weight: 400; color: var(--ink-48); letter-spacing: -0.224px; white-space: nowrap; }
.hint { margin: 0 20px 12px; font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px; }
.prefs { margin: 0 20px; background: var(--tile); color: var(--on-dark); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 10px; }
.prefs .k { font-size: 13px; color: var(--on-dark-muted); letter-spacing: -0.08px; }
.prefs .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.prefs .lab { background: rgba(255,255,255,.12); color: var(--on-dark); border: 0; }

.cups { display: grid; gap: 0; margin: 0 20px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; overflow: hidden; }
.cup { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; text-align: left; background: none; border: 0; width: 100%; cursor: pointer; }
.cup + .cup { border-top: 1px solid var(--divider); }
.cup .th { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; }
.cup .t { min-width: 0; display: grid; gap: 1px; }
.cup b { font-size: 15px; font-weight: 600; letter-spacing: -0.224px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cup .m { font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cup .r { font-size: 12px; white-space: nowrap; text-align: right; display: grid; gap: 2px; justify-items: end; }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; background: var(--parchment); display: grid; place-items: center; color: var(--ink); }
.ph svg { width: 60%; height: 60%; filter: var(--product-shadow); }
.stars { letter-spacing: 1px; font-size: 12px; white-space: nowrap; }
.stars i { font-style: normal; color: var(--hairline); }

const toneVar = (g) => g >= 0 ? `var(${GROUP_VAR[g]})` : 'var(--neutral)';
const yearCups = (y) => cups.filter(c => c.date.startsWith(String(y))).sort((a, b) => (a.date + a.createdAt).localeCompare(b.date + b.createdAt));

const dayOfYear = (iso) => { const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 864e5; };

function dialSvg(ycups, year) {
  const R1 = 108, L = 15, GAP = 2.5, RM0 = 86, RM1 = 92, total = daysIn(year);
  const ang = (d) => (d / total) * 2 * Math.PI - Math.PI / 2;
  const P = (r, a) => `${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`;
  const sel = state.sel, hit = sel ? new Set(matches(sel).map(c => c.id)) : null;
  let s = `<svg class="dial" viewBox="-172 -172 344 344" role="img" aria-label="${year}年の文字盤。${ycups.length}杯">`;
  /* 月ごとの傾向リング: その月の一杯の平均の明るさ */
  for (let m = 0; m < 12; m++) {
    const a0 = ang(dayOfYear(`${year}-${String(m + 1).padStart(2, '0')}-01`)) + .012, a1 = ang(m === 11 ? total : dayOfYear(`${year}-${String(m + 2).padStart(2, '0')}-01`)) - .012;
    const tones = ycups.filter(c => +c.date.slice(5, 7) === m + 1).map(mainGroup).filter(g => g >= 0);
    const avg = tones.length ? Math.round(tones.reduce((x, y) => x + y, 0) / tones.length) : null;
    s += `<path d="M${P(RM1, a0)} A${RM1} ${RM1} 0 0 1 ${P(RM1, a1)} L${P(RM0, a1)} A${RM0} ${RM0} 0 0 0 ${P(RM0, a0)}Z" fill="${avg === null ? 'var(--divider)' : toneVar(avg)}"><title>${m + 1}月 ・ ${tones.length ? `${tones.length}杯の平均は「${COLOR_GROUPS[avg]}」寄り` : '記録なし'}</title></path>`;
    const am = (a0 + a1) / 2;
    s += `<text x="${(RM0 - 13) * Math.cos(am)}" y="${(RM0 - 13) * Math.sin(am) + 3.5}" text-anchor="middle" font-size="10" fill="var(--ink-48)">${m + 1}</text>`;
  }
  /* 今日の針（今年だけ） */
  if (year === thisYear()) {
    const t = new Date(), a = ang(dayOfYear(`${year}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`) + .5);
    s += `<line x1="${P(48, a).split(' ')[0]}" y1="${P(48, a).split(' ')[1]}" x2="${P(R1 + 3 * (L + GAP) + 4, a).split(' ')[0]}" y2="${P(R1 + 3 * (L + GAP) + 4, a).split(' ')[1]}" stroke="var(--ink)" stroke-opacity=".5" stroke-width="1"/>`;
    s += `<circle cx="${P(R1 + 3 * (L + GAP) + 7, a).split(' ')[0]}" cy="${P(R1 + 3 * (L + GAP) + 7, a).split(' ')[1]}" r="2.5" fill="var(--ink)" fill-opacity=".6"><title>今日</title></circle>`;
  }
  /* 一杯ごとの目盛り。同じ日に2杯以上なら外へ重ねる */
  const stack = {};
  ycups.forEach((c) => {
    const d = dayOfYear(c.date), k = stack[d] = (stack[d] || 0) + 1, a = ang(d + .5);
    if (k > 3) return;
    const r0 = R1 + (k - 1) * (L + GAP), r1 = r0 + L, g = mainGroup(c), dim = hit && !hit.has(c.id);
    const [x0, y0] = P(r0, a).split(' '), [x1, y1] = P(r1, a).split(' ');
    const label = `${fmtDate(c.date)} ${esc(c.bean)}｜${c.taste ? esc(c.taste.labels.join('・')) || 'メモのみ' : '味がまだ'}`;
    s += `<g class="tick${state.justAdded === c.id ? ' grow' : ''}" data-act="open" data-id="${c.id}" opacity="${dim ? .13 : 1}"><title>${label}</title>`
      + `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="transparent" stroke-width="9"/>`
      + (g === -2
        ? `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--ink-48)" stroke-width="1.6" stroke-dasharray="2.2 2.2"/>`
        : `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${toneVar(g)}" stroke-width="3" stroke-linecap="round"/>`)
      + `</g>`;
  });
  s += `<text y="2" text-anchor="middle" font-size="44" font-weight="600" fill="var(--ink)" style="font-variant-numeric:tabular-nums;letter-spacing:-1px">${ycups.length}</text>`;
  s += `<text y="24" text-anchor="middle" font-size="12" fill="var(--ink-48)">杯</text>`;
  return s + '</svg>';
}

      <p class="group-label">どちらから記録しますか？</p>
      <div class="choose">
        <button type="button" class="choice" data-act="startWith" data-with="brew" ${d.bean.trim() ? '' : 'disabled'}><span class="ic">${KETTLE}</span><span><b>淹れ方から</b><span>いま淹れている。味は飲んでから足す</span></span><span class="arr">›</span></button>
        <button type="button" class="choice" data-act="startWith" data-with="taste" ${d.bean.trim() ? '' : 'disabled'}><span class="ic">${CUPICON}</span><span><b>味から</b><span>もう飲んだ。淹れ方はあとで思い出して足す</span></span><span class="arr">›</span></button>
      </div>
      <p class="group-foot" id="beanFoot" ${d.bean.trim() ? 'hidden' : ''}>豆の名前を入れると選べます。</p>
    </div>`}
  </form>`;
}
function photoRow(d) {
  return d.photo
    ? `<div class="photo-slot"><img class="photo" src="${d.photo}" alt="選んだ写真"><button type="button" class="rm" data-act="rmPhoto" aria-label="写真を外す">×</button></div><span style="font-size:14px;color:var(--ink-48)">1枚まで</span>`
    : `<div class="photo-slot"><div class="ph">${DRIPPER}</div></div><label class="addphoto">写真を選ぶ<input id="f-photo" type="file" accept="image/*"></label>`;
}

/* ---------- brew form ---------- */
function stepperRow(f, v, label) {
  const unit = STEPS[f][3];
  return `<div class="row"><span class="lbl" id="lbl-${f}">${label}</span><div class="stepper" role="group" aria-labelledby="lbl-${f}">
    <button type="button" class="step" data-act="step" data-f="${f}" data-d="-1" aria-label="${label}を減らす">−</button>
    <output id="out-${f}">${v}${unit ? `<small> ${unit}</small>` : ''}</output>
    <button type="button" class="step" data-act="step" data-f="${f}" data-d="1" aria-label="${label}を増やす">＋</button></div></div>`;
}
function brewForm() {
  const d = state.draft, c = cups.find(x => x.id === state.cid);
  return `
  <div class="subnav center">
    <div class="side"><button class="textbtn" data-act="cancelForm">${state.chain ? 'あとで' : 'キャンセル'}</button></div>
    <h1>淹れ方</h1>
    <div class="side"><button class="textbtn strong" data-act="saveBrew">保存</button></div>
  </div>
  <form class="form" onsubmit="return false">
    <p class="group-foot" style="margin-top:0">${esc(c.bean)} ・ ${fmtDate(c.date)}　${d._from ? `<br>${d._from}の淹れ方を入れています。違うところだけ直してください。` : ''}</p>
    <div>
      <p class="group-label">器具</p>
      <div class="group"><div class="methods" role="group" aria-label="器具">${METHODS.map(m => `<button type="button" class="lab" data-act="method" data-m="${m}" aria-pressed="${d.method === m}">${m}</button>`).join('')}</div></div>
    </div>
    <div>
      <p class="group-label">分量</p>
      <div class="group">
        ${stepperRow('dose', d.dose, '豆')}
        <div class="row col"><div class="top"><label for="f-ratio">比率</label><span class="val" id="out-ratio">1 : ${d.ratio}</span></div>
          <input type="range" id="f-ratio" data-f="ratio" min="10" max="20" step="0.1" value="${d.ratio}">
          <div class="scale"><span>濃い 1:10</span><span>1:20 軽い</span></div></div>
      </div>
      <div class="water" aria-live="polite"><div class="l"><b>お湯の量</b>豆 × 比率で自動計算</div><output id="out-water">${water(d)}<small> g</small></output></div>
    </div>
    <div>
      <p class="group-label">抽出条件</p>
      <div class="group">${stepperRow('temp', d.temp, '温度')}${stepperRow('clicks', d.clicks, 'クリック数')}</div>
      <p class="group-foot">クリック数はミルの目盛り（ゼロ点から何クリック戻したか）。</p>
    </div>
    <div>
      <p class="group-label">メモ</p>
      <div class="group"><textarea id="f-bmemo" data-f="memo" placeholder="蒸らし時間、注ぎ方など">${esc(d.memo)}</textarea></div>
    </div>
  </form>`;
}

/* ---------- taste form ---------- */
const canSaveTaste = (d) => d.rating || d.labels.length || d.memo.trim();
const ratingBtns = (v) => [1, 2, 3, 4, 5].map(n => `<button type="button" class="star ${n <= v ? 'on' : ''}" data-act="rate" data-v="${n}" aria-label="${n}つ星" aria-pressed="${n === v}">${STAR}</button>`).join('');

/* ---------- flows ---------- */
function brewDraftFor(c) {
  if (c.brew) return { ...c.brew };
  const prev = sorted().filter(x => x.brew && x.id !== c.id);
  const same = prev.find(x => x.bean === c.bean);
  const src = same || prev[0];
  return src ? { ...src.brew, memo: '', _from: `${same ? '同じ豆の' : '前回'}（${fmtDate(src.date)}）` } : { ...DEFAULT_BREW };
}
const tasteDraftFor = (c) => c.taste ? structuredClone(c.taste) : { rating: 0, labels: [], memo: '' };
function openBrew(chain = false) { const c = cups.find(x => x.id === state.cid); go('brewForm', { draft: brewDraftFor(c), chain }); }
function openTaste(chain = false) { const c = cups.find(x => x.id === state.cid); go('tasteForm', { draft: tasteDraftFor(c), chain, descLabel: null }); }

function resize(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, 1000 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 2800); }
function save(mutate, onFail) { const prev = structuredClone(cups); mutate(); if (!persist()) { cups = prev; onFail && onFail(); return false; } return true; }

/* ---------- events ---------- */
function handle(el) {
  const a = el.dataset.act, d = state.draft;
  switch (a) {
    case 'menu': $('drawer').hidden = false; break;
    case 'more': state.more = true; refreshTaste(); break;
    case 'openGroup': state.openGroup = state.openGroup === el.dataset.g ? null : el.dataset.g; refreshTaste(); break;
    case 'usePrev': { const T = tgtT(); el.dataset.labels.split(',').forEach(l => { if (l && !T.labels.includes(l)) T.labels.push(l); }); state.descLabel = null; refreshTaste(); updateSave(); break; }
    case 'menuClose': $('drawer').hidden = true; break;
    case 'tab': $('drawer').hidden = true; state.tab = el.dataset.to; go(el.dataset.to, { sel: el.dataset.to === 'map' ? state.sel : state.sel }); break;
    case 'pick': {
      const s = { type: el.dataset.type, name: el.dataset.name };
      state.sel = state.sel && state.sel.type === s.type && state.sel.name === s.name ? null : s;
      const st = view.scrollTop; render(); view.scrollTop = st; break;
    }
    case 'pickLabel': state.tab = 'map'; go('map', { sel: { type: 'label', name: el.dataset.name } }); view.scrollTop = 0; break;
    case 'clearSel': state.sel = null; render(); break;
    case 'year': state.year = Math.min(thisYear(), Math.max(firstYear(), state.year + +el.dataset.d)); { const st = view.scrollTop; render(); view.scrollTop = st; } break;
    case 'open': openCup(el.dataset.id); break;
    case 'back': go(state.back || 'map'); break;
    case 'resume': openCup(el.dataset.id); break;
    case 'newCup': go('record', { back: state.screen, descLabel: null, more: false, openGroup: null, draft: { bean: '', date: today(), photo: null, taste: { rating: 0, labels: [], memo: '' }, brewOn: false, brew: null } }); break;
    case 'cancelRecord': go(state.back || 'map'); break;
    case 'brewOn': { d.brewOn = true; d.brew = brewPrefill(d.bean.trim()); const st = view.scrollTop; render(); view.scrollTop = st; break; }
    case 'brewOff': { d.brewOn = false; const st = view.scrollTop; render(); view.scrollTop = st; break; }
    case 'saveRecord': {
      if (!d.bean.trim()) return;
      const t = d.taste, filled = t.rating || t.labels.length || t.memo.trim();
      const fields = { date: d.date || today(), bean: d.bean.trim(),
        taste: filled ? { rating: t.rating, labels: [...t.labels], memo: t.memo.trim() } : null,
        brew: d.brewOn ? { method: d.brew.method, dose: d.brew.dose, ratio: d.brew.ratio, temp: d.brew.temp, clicks: d.brew.clicks, memo: (d.brew.memo || '').trim() } : null };
      if (d.id) {
        const old = cups.find(x => x.id === d.id), hadTaste = !!old.taste;
        if (!save(() => Object.assign(old, fields))) return;
        if (!hadTaste && filled) state.justAdded = old.id;
        go(state.back || 'map'); toast('保存しました'); break;
      }
      const c = { id: uid(), createdAt: new Date().toISOString(), ...fields };
      if (!save(() => cups.push(c))) return;
      state.justAdded = c.id; state.tab = 'map'; state.sel = null; go('map');
      toast(filled ? '記録しました' : '記録しました。飲んだら「味を足す」から味を残せます');
      break;
    }
    case 'switchMode': d.mode = d.mode === 'brew' ? 'taste' : 'brew'; render(); break;
    case 'editCup': { const c = cups.find(x => x.id === state.cid); go('newCup', { draft: { id: c.id, bean: c.bean, date: c.date, photo: c.photo } }); break; }
    case 'cancel': go(state.back || 'map'); break;
    case 'pickBean': d.bean = el.dataset.name; $('f-bean').value = d.bean; refreshBean(); break;
    case 'rmPhoto': d.photo = null; $('photoRow').innerHTML = photoRow(d); break;
    case 'rmPhotoR': { d.photo = null; const st = view.scrollTop; render(); view.scrollTop = st; break; }
    case 'startWith': {
      if (!d.bean.trim()) return;
      const c = { id: uid(), date: d.date || today(), bean: d.bean.trim(), photo: d.photo, brew: null, taste: null, createdAt: new Date().toISOString() };
      if (!save(() => cups.push(c))) return;
      state.cid = c.id; state.back = 'map';
      el.dataset.with === 'brew' ? openBrew() : openTaste(true);
      break;
    }
    case 'saveBasics': {
      if (!d.bean.trim()) return;
      if (!save(() => { const c = cups.find(x => x.id === d.id); Object.assign(c, { bean: d.bean.trim(), date: d.date || c.date, photo: d.photo }); })) return;
      go(state.back || 'map'); toast('更新しました'); break;
    }
    case 'cancelForm': {
      const c = cups.find(x => x.id === state.cid);
      if (!c.brew && !c.taste && !c.photo) { save(() => { cups = cups.filter(x => x.id !== c.id); }); go('map'); break; }
      go(state.back || 'map'); break;
    }
    case 'method': { const B = tgtB(); B.method = el.dataset.m; view.querySelectorAll('[data-act="method"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === B.method)); break; }
    case 'step': {
      const f = el.dataset.f, [inc, min, max, unit] = STEPS[f], B = tgtB();
      B[f] = fix1(Math.min(max, Math.max(min, B[f] + inc * +el.dataset.d)));
      $('out-' + f).innerHTML = `${B[f]}${unit ? `<small> ${unit}</small>` : ''}`;
      if (f === 'dose') $('out-water').innerHTML = `${water(B)}<small> g</small>`;
      break;
    }
    case 'saveBrew': {
      const c = cups.find(x => x.id === state.cid), brew = { method: d.method, dose: d.dose, ratio: d.ratio, temp: d.temp, clicks: d.clicks, memo: (d.memo || '').trim() };
      if (!save(() => { c.brew = brew; })) return;
      go(state.back || 'map'); toast(c.taste ? '淹れ方を記録しました' : '淹れ方を記録しました。飲んだら「味を記録」へ'); break;
    }
    case 'rate': { const T = tgtT(); T.rating = T.rating === +el.dataset.v ? 0 : +el.dataset.v; $('ratingBox').innerHTML = ratingBtns(T.rating); updateSave(); break; }
    case 'toggleLabel': {
      const T = tgtT(), l = el.dataset.name, i = T.labels.indexOf(l);
      i >= 0 ? T.labels.splice(i, 1) : T.labels.push(l);
      state.descLabel = l;
      if ($('tastebox')) { refreshTaste(); updateSave(); break; }
      el.setAttribute('aria-pressed', i < 0);
      $('desc').innerHTML = `<b>${l}</b><span>${LABEL_INFO[l].desc}</span>`;
      const lc = $('labCount'); if (lc) lc.textContent = T.labels.length ? `${T.labels.length}個選択中` : '';
      updateSave(); break;
    }
    case 'saveTaste': {
      if (!canSaveTaste(d)) return;
      const c = cups.find(x => x.id === state.cid), chainNext = state.chain && !c.brew;
      if (!c.taste) state.justAdded = c.id;
      if (!save(() => { c.taste = { rating: d.rating, labels: [...d.labels], memo: (d.memo || '').trim() }; })) return;
      if (chainNext) { openBrew(true); toast('味を記録しました。淹れ方も残しますか？'); }
      else { go(state.back || 'map'); toast('味を記録しました'); }
      break;
    }
    case 'brewForm': openBrew(); break;
    case 'tasteForm': openTaste(); break;
    case 'askDelete': state.confirm = true; render(); view.scrollTop = view.scrollHeight; break;
    case 'cancelDelete': state.confirm = false; render(); view.scrollTop = view.scrollHeight; break;
    case 'deleteCup': save(() => { cups = cups.filter(x => x.id !== state.cid); }); go(state.back || 'map'); toast('削除しました'); break;
    case 'clearSamples': save(() => { cups = cups.filter(x => !x.sample); }); state.sel = null; render(); toast('サンプルを消しました'); break;
  }
}
function refreshBean() {
  if (state.screen === 'record') refreshTaste();
  const d = state.draft, ok = !!d.bean.trim();
  view.querySelectorAll('[data-act="startWith"]').forEach(x => { x.disabled = !ok; });
  const foot = $('beanFoot'); if (foot) foot.hidden = ok;
  const sb = $('saveBtn'); if (sb && state.screen === 'newCup') sb.disabled = !ok;
  view.querySelectorAll('[data-act="saveRecord"]').forEach(x => { x.disabled = !ok; });
  view.querySelectorAll('[data-act="pickBean"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.name === d.bean));
}
function updateSave() { const sb = $('saveBtn'); if (sb && state.screen === 'tasteForm') sb.disabled = !canSaveTaste(state.draft); }

document.addEventListener('click', (ev) => { const el = ev.target.closest('[data-act]'); if (el) handle(el); });
document.addEventListener('keydown', (ev) => {
  const el = ev.target.closest && ev.target.closest('g[data-act]');
  if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); handle(el); }
});
document.addEventListener('input', (ev) => {
  const tg = ev.target;
  if (tg.id === 'q') {
    state.q = tg.value; const q = tg.value.trim().toLowerCase();
    const list = sorted().filter(c => !q || (c.bean + (c.taste ? c.taste.labels.join('') + c.taste.memo : '')).toLowerCase().includes(q));
    const byMonth = {}; list.forEach(c => { const k = c.date.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(c); });
    $('logList').innerHTML = logList(byMonth); return;
  }
  const f = tg.dataset.f; if (!f || !state.draft) return;
  if (f === 'ratio') { const B = tgtB(); B.ratio = fix1(+tg.value); $('out-ratio').textContent = `1 : ${B.ratio}`; $('out-water').innerHTML = `${water(B)}<small> g</small>`; }
  else if (f.startsWith('t.')) state.draft.taste[f.slice(2)] = tg.value;
  else if (f.startsWith('b.')) state.draft.brew[f.slice(2)] = tg.value;
  else { state.draft[f] = tg.value; if (f === 'bean') refreshBean(); if (state.screen === 'tasteForm') updateSave(); }
});
document.addEventListener('change', async (ev) => {
  if (ev.target.id !== 'f-photo' || !ev.target.files[0]) return;
  try { state.draft.photo = await resize(ev.target.files[0]); } catch { toast('この画像は読み込めませんでした'); }
  if (state.screen === 'record') { const st = view.scrollTop; render(); view.scrollTop = st; } else $('photoRow').innerHTML = photoRow(state.draft);
});

const now = new Date();
$('clock').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
render();
</script>
</body>
</html>
